name: Keep Backend Warm

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend keep-alive endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          echo "Pinging $BACKEND_URL/ping"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -f "$BACKEND_URL/ping" || true)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Ping successful (HTTP $RESPONSE)"
          else
            echo "⚠️ Ping failed (HTTP $RESPONSE)"
            # retry once
            echo "Retrying..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -f "$BACKEND_URL/ping" || true)
            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Retry successful (HTTP $RESPONSE)"
            else
              echo "❌ Retry failed (HTTP $RESPONSE)"
            fi
          fi
